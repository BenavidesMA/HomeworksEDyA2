<div class="contenedor">
  <app-gestion-pacientes
    [pacientes]="pacientes()"
    (agregarPaciente)="agregarPaciente($event)"
    (atenderPaciente)="atenderPaciente()"
  ></app-gestion-pacientes>

  <app-historial-atencion
    [historial]="historial()"
  ></app-historial-atencion>

  <app-rotacion-medicos
    [medicoActual]="medicoActual()"
    [medicos]="medicos()"
    (agregarMedico)="agregarMedico($event)"
    (rotarManual)="rotarMedicoManual()"
  ></app-rotacion-medicos>

  <app-comite-admin
    [miembroActual]="miembroActual()"
    [miembros]="miembros()"
    (agregarMiembro)="agregarMiembro($event)"
    (irSiguiente)="siguienteMiembro()"
    (irAnterior)="anteriorMiembro()"
  ></app-comite-admin>
</div>
