<div class="pagina">
  <h2>Registro</h2>

  <div class="mb-3">
    <input
      type="email"
      class="form-control"
      placeholder="Email"
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
    />
  </div>

  <div class="mb-3">
    <input
      type="password"
      class="form-control"
      placeholder="Password (mínimo 6 caracteres)"
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
    />
  </div>

  <button type="button" class="btn btn-primary w-100" (click)="handleRegister()">Crear cuenta</button>

  <p class="mt-3 text-center">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
</div>
