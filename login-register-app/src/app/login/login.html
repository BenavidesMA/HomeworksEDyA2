<div class="pagina">
  <h2>Login</h2>

  <div class="mb-3">
    <input
      type="email"
      class="form-control"
      placeholder="Email"
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
    />
  </div>

  <div class="mb-3">
    <input
      type="password"
      class="form-control"
      placeholder="Password"
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
    />
  </div>

  <button type="button" class="btn btn-primary w-100" (click)="handleLogin()">Login</button>

  <p class="mt-3 text-center">¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
</div>
