<div class="registro">
  <h2>Crear cuenta</h2>
  <input type="email" placeholder="Correo" [(ngModel)]="correo">
  <input type="password" placeholder="Contraseña (mínimo 6 caracteres)" [(ngModel)]="clave">
  <input type="password" placeholder="Repite la contraseña" [(ngModel)]="repetir">
  <button (click)="registrarse()">Registrarme</button>
  <p class="mensaje" [class.exito]="creado">{{ mensaje }}</p>
  <a routerLink="/login">Ya tengo cuenta, iniciar sesión</a>
</div>
